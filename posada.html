<!doctype html>
<!-- Posada Jacobo · versión 2026-11-25c -->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#173324">
<title>Posada Navideña · Jacobo</title>
<meta property="og:title" content="Posada Navideña · Jacobo">
<meta property="og:description" content="16 de diciembre, 8:00 p.m. · Hacienda Santa Mónica. Confirma tu asistencia.">
<style>
:root{
  --verde:#173324; --verde2:#21452f; --oro:#d9b778; --oro2:#f3dfae; --rojo:#c3313b; --crema:#f6eedd;
  --txt:#f6eedd; --sec:rgba(246,238,221,.72);
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none !important}
html,body{min-height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif;color:var(--txt);
  background:radial-gradient(120% 80% at 50% 0%,#24503a 0%,var(--verde) 55%,#0f241a 100%) fixed;overflow-x:hidden;-webkit-font-smoothing:antialiased}
#nieve{position:fixed;inset:0;pointer-events:none;z-index:1}
main{position:relative;z-index:2;max-width:520px;margin:0 auto;padding:28px 16px calc(40px + env(safe-area-inset-bottom))}
.script{font-family:'Snell Roundhand','Segoe Script','Apple Chancery','Brush Script MT',cursive;font-weight:400}

/* ---------- Sobre de entrada ---------- */
#sobre{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:20px;
  background:radial-gradient(120% 80% at 50% 20%,#24503a 0%,var(--verde) 60%,#0f241a 100%);transition:opacity .7s ease,visibility .7s}
#sobre.fuera{opacity:0;visibility:hidden}
.env-txt{text-align:center;margin-bottom:70px}
.env-txt small{display:block;letter-spacing:.32em;text-transform:uppercase;font-size:12px;color:var(--oro);margin-bottom:6px}
.env-txt b{font-size:40px;color:var(--oro2);line-height:1}
.env{position:relative;width:min(300px,78vw);aspect-ratio:3/2;margin:0 auto;perspective:900px}
.env-fondo{position:absolute;inset:0;border-radius:10px;background:linear-gradient(160deg,#1d3f2c,#16301f);box-shadow:0 30px 60px rgba(0,0,0,.45);z-index:1}
.env-frente{position:absolute;inset:0;border-radius:10px;overflow:hidden;z-index:3;pointer-events:none;box-shadow:inset 0 0 0 1px rgba(217,183,120,.35)}
.env-frente::before,.env-frente::after{content:"";position:absolute;inset:0}
.env-frente::before{background:linear-gradient(160deg,#2c5b40,#1f4430);clip-path:polygon(0 0,50% 58%,100% 0,100% 100%,0 100%)}
.env-frente::after{background:linear-gradient(0deg,rgba(0,0,0,.18),transparent);clip-path:polygon(0 100%,50% 52%,100% 100%)}
.env-tapa{position:absolute;left:0;right:0;top:0;height:62%;transform-origin:top;transition:transform .9s cubic-bezier(.4,.1,.2,1),z-index 0s .45s;z-index:4;
  background:linear-gradient(180deg,#336a4b,#24503a);clip-path:polygon(0 0,100% 0,50% 100%);filter:drop-shadow(0 4px 6px rgba(0,0,0,.3))}
.env-carta{position:absolute;left:7%;right:7%;top:10%;height:86%;border-radius:6px;background:var(--crema);z-index:2;box-shadow:0 2px 8px rgba(0,0,0,.2);align-content:start;padding-top:12%;transition:transform .9s cubic-bezier(.3,.1,.2,1) .5s;
  display:grid;place-items:center;color:var(--verde);text-align:center;font-size:13px;letter-spacing:.2em;text-transform:uppercase}
.env-carta .script{font-size:30px;letter-spacing:0;text-transform:none;color:var(--rojo)}
.sello{position:absolute;left:50%;top:58%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;z-index:5;display:grid;place-items:center;
  background:radial-gradient(circle at 35% 30%,#e3545d,#9e1f28);box-shadow:0 4px 10px rgba(0,0,0,.35),inset 0 0 0 3px rgba(255,255,255,.12);
  color:#f8d9a8;font:700 26px/1 Georgia,serif;transition:opacity .3s,transform .3s}
#sobre.abierto .env-tapa{transform:rotateX(180deg);z-index:1}
.env-txt,.abrir{transition:opacity .4s}
#sobre.abierto .env-txt,#sobre.abierto .abrir{opacity:0}
#sobre.abierto .sello{opacity:0;transform:scale(.6)}
#sobre.abierto .env-carta{transform:translateY(-62%)}
.abrir{margin-top:34px;border:0;border-radius:999px;padding:15px 30px;font:700 16px/1 inherit;font-family:inherit;color:#2a1d07;cursor:pointer;
  background:linear-gradient(180deg,var(--oro2),var(--oro));box-shadow:0 10px 26px rgba(217,183,120,.35),inset 0 1px 0 rgba(255,255,255,.6);animation:latido 2.2s ease-in-out infinite}
@keyframes latido{50%{transform:scale(1.05)}}

/* ---------- Invitación ---------- */
.inv{position:relative;border-radius:22px;overflow:hidden;box-shadow:0 30px 70px rgba(0,0,0,.5),0 0 0 1px rgba(217,183,120,.3);animation:entra 1s cubic-bezier(.2,.8,.2,1) both,flota 6s ease-in-out 1s infinite}
.inv img{display:block;width:100%;height:auto}
.inv::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,240,200,.28) 45%,transparent 60%);transform:translateX(-120%);animation:brillo 5s ease-in-out 1.4s infinite}
@keyframes entra{from{opacity:0;transform:translateY(40px) scale(.96)}}
@keyframes flota{50%{transform:translateY(-6px)}}
@keyframes brillo{0%{transform:translateX(-120%)}35%,100%{transform:translateX(120%)}}
.titulo{text-align:center;margin:30px 0 14px}
.titulo small{display:block;letter-spacing:.3em;text-transform:uppercase;font-size:12px;color:var(--oro)}
.titulo b{font-size:30px;color:var(--oro2);font-weight:400}

/* ---------- Cuenta regresiva ---------- */
.cuenta{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cuenta div{border-radius:18px;padding:12px 4px;text-align:center;background:linear-gradient(160deg,rgba(255,255,255,.12),rgba(255,255,255,.04));border:1px solid rgba(217,183,120,.35)}
.cuenta b{display:block;font-size:30px;font-weight:700;color:var(--oro2);font-variant-numeric:tabular-nums;line-height:1.1}
.cuenta small{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--sec)}
.ya{text-align:center;font-size:20px;color:var(--oro2);padding:12px}

.acciones{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.btn2{display:flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:13px 10px;font-weight:650;font-size:14.5px;text-decoration:none;color:var(--crema);
  background:rgba(255,255,255,.08);border:1px solid rgba(217,183,120,.45);transition:background .25s,transform .12s}
.btn2:active{transform:scale(.97)}
.btn2:hover{background:rgba(255,255,255,.14)}

/* ---------- Confirmación ---------- */
.conf{margin-top:22px;border-radius:26px;padding:22px 18px;background:linear-gradient(160deg,rgba(246,238,221,.97),rgba(240,228,204,.95));color:#2a2116;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.conf h2{font-size:26px;text-align:center;color:var(--rojo);font-weight:400;margin-bottom:4px}
.conf p.sub{text-align:center;font-size:14px;color:#6b5b45;margin-bottom:16px}
.conf label{display:block;font-size:13px;font-weight:700;color:#6b5b45;margin-bottom:12px}
.conf input,.conf textarea{display:block;width:100%;margin-top:5px;padding:12px 14px;border:0;border-radius:14px;background:#fff;font:inherit;font-size:16px;color:#2a2116;
  box-shadow:inset 0 1px 2px rgba(60,40,10,.15),inset 0 0 0 1px rgba(60,40,10,.08)}
.conf input:focus,.conf textarea:focus{outline:none;box-shadow:inset 0 1px 2px rgba(60,40,10,.15),0 0 0 3px rgba(195,49,59,.25)}
.quien{border-radius:14px;padding:12px 14px;margin:-4px 0 14px;font-size:15px;background:#e3f4ea;color:#1f6b40}
.quien.mal{background:#fbe7e8;color:#a3242d}
.quien.busca{background:#f3ecdd;color:#6b5b45}
.opc{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:4px 0 14px}
.opc button{border:2px solid transparent;border-radius:16px;padding:14px 8px;font:inherit;font-weight:700;font-size:15px;cursor:pointer;background:#fff;color:#2a2116;box-shadow:inset 0 0 0 1px rgba(60,40,10,.1);transition:all .25s}
.opc button.on[data-v="SI"]{border-color:#2f8a57;background:#e3f4ea;color:#1f6b40}
.opc button.on[data-v="NO"]{border-color:#c3313b;background:#fbe7e8;color:#a3242d}
.enviar{width:100%;border:0;border-radius:999px;padding:16px;font:inherit;font-weight:700;font-size:17px;color:#fff;cursor:pointer;
  background:linear-gradient(180deg,#d8434d,#a8222c);box-shadow:0 10px 24px rgba(168,34,44,.35),inset 0 1px 0 rgba(255,255,255,.25);transition:transform .12s,filter .25s}
.enviar:active{transform:scale(.98)}
.enviar:disabled{filter:grayscale(.4) brightness(.9)}
.err{background:#fbe7e8;color:#a3242d;border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.gracias{text-align:center;padding:10px 0}
.gracias .big{font-size:54px}
.gracias h2{margin:6px 0}
.gracias p{color:#6b5b45}
.cambiar{margin-top:14px;border:0;background:none;color:var(--rojo);font:inherit;font-weight:700;cursor:pointer;text-decoration:underline}
.pie{text-align:center;color:var(--sec);font-size:12px;margin-top:24px}
#confeti{position:fixed;inset:0;pointer-events:none;z-index:20}
#musica{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:15;width:50px;height:50px;border-radius:50%;border:1px solid rgba(217,183,120,.55);
  background:rgba(23,51,36,.82);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:var(--oro2);font-size:22px;cursor:pointer;box-shadow:0 8px 20px rgba(0,0,0,.35)}
#musica.suena{animation:latido 1.6s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none !important;transition:none !important}}
</style>
</head>

<canvas id="nieve" aria-hidden="true"></canvas>
<canvas id="confeti" aria-hidden="true"></canvas>
<audio id="cancion" src="posada.mp3" loop preload="auto"></audio>

<div id="sobre">

    </div>

</div>

}
$('#abrir').onclick = abrirSobre;

/* ---------- Música (en loop; el celular solo deja sonar después de un toque) ---------- */
const cancion = $('#cancion'), btnMus = $('#musica');
let callada = false;
function tocar(){ if(callada) return; cancion.volume = .7; cancion.play().catch(() => {}); }
cancion.onplay = () => { btnMus.textContent = '🔊'; btnMus.classList.add('suena'); };
cancion.onpause = () => { btnMus.textContent = '🔇'; btnMus.classList.remove('suena'); };
btnMus.onclick = e => { e.stopPropagation(); if(cancion.paused){ callada = false; tocar(); } else { callada = true; cancion.pause(); } };
$('#abrir').addEventListener('click', tocar);
document.addEventListener('pointerdown', e => { if(!btnMus.contains(e.target)) tocar(); }, { once:true });
if(lsGet('posada_abierta')) $('#sobre').hidden = true;
else $('#abrir').addEventListener('click', () => lsSet('posada_abierta', true), { once:true });

/* ---------- Enlaces ---------- */
$('#mapa').href = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent('Hacienda Santa Mónica Mesa de Otay Tijuana');
$('#cal').href = 'https://calendar.google.com/calendar/render?action=TEMPLATE&text=' + encodeURIComponent('Posada Navideña Jacobo') +
  '&dates=20261217T040000Z/20261217T100000Z&location=' + encodeURIComponent(LUGAR) + '&details=' + encodeURIComponent('Horario: 8:00 p.m. a 2:00 a.m.');

/* ---------- Cuenta regresiva ---------- */
function contar(){
  let ms = EVENTO - Date.now();
  if(ms <= 0){ $('#cuenta').hidden = true; $('.titulo').hidden = true; $('#ya').hidden = false; return; }
  const d = Math.floor(ms / 864e5); ms -= d * 864e5;
  const h = Math.floor(ms / 36e5); ms -= h * 36e5;
  const m = Math.floor(ms / 6e4); const s = Math.floor((ms - m * 6e4) / 1000);
  $('#cd-d').textContent = d; $('#cd-h').textContent = h; $('#cd-m').textContent = m; $('#cd-s').textContent = String(s).padStart(2, '0');
}
contar(); setInterval(contar, 1000);

/* ---------- Nieve y destellos ---------- */
(function(){
  const c = $('#nieve'), x = c.getContext('2d'); let W, H, P = [];
  const tam = () => { W = c.width = innerWidth * devicePixelRatio; H = c.height = innerHeight * devicePixelRatio; };
  tam(); addEventListener('resize', tam);
  const n = QUIETO ? 0 : Math.min(70, Math.round(innerWidth / 8));
  for(let i = 0; i < n; i++) P.push({ x: Math.random() * W, y: Math.random() * H, r: (Math.random() * 2.2 + .6) * devicePixelRatio,
    v: (Math.random() * .5 + .25) * devicePixelRatio, o: Math.random() * 6.28, oro: Math.random() < .35 });
  (function cuadro(){
    x.clearRect(0, 0, W, H);
    P.forEach(p => {
      p.y += p.v; p.o += .02; p.x += Math.sin(p.o) * .3 * devicePixelRatio;
      if(p.y > H + 10){ p.y = -10; p.x = Math.random() * W; }
      x.globalAlpha = p.oro ? .55 + Math.sin(p.o * 3) * .35 : .75;
      x.fillStyle = p.oro ? '#f3dfae' : '#ffffff';
      x.beginPath(); x.arc(p.x, p.y, p.r, 0, 6.28); x.fill();
    });
    if(n) requestAnimationFrame(cuadro);
  })();
})();

/* ---------- Confeti al confirmar ---------- */
function confeti(){
  if(QUIETO) return;
  const c = $('#confeti'), x = c.getContext('2d');
  c.width = innerWidth * devicePixelRatio; c.height = innerHeight * devicePixelRatio;
  const col = ['#c3313b', '#f3dfae', '#d9b778', '#2f8a57', '#ffffff'];
  const P = Array.from({ length: 140 }, () => ({ x: c.width / 2, y: c.height * .6, vx: (Math.random() - .5) * 16 * devicePixelRatio,
    vy: (-Math.random() * 14 - 6) * devicePixelRatio, s: (Math.random() * 6 + 4) * devicePixelRatio, r: Math.random() * 6, c: col[Math.floor(Math.random() * col.length)] }));
  let t = 0;
  (function cuadro(){
    x.clearRect(0, 0, c.width, c.height);
    P.forEach(p => { p.vy += .35 * devicePixelRatio; p.x += p.vx; p.y += p.vy; p.r += .1;
      x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.fillStyle = p.c; x.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); x.restore(); });
    if(++t < 160) requestAnimationFrame(cuadro); else x.clearRect(0, 0, c.width, c.height);
  })();
}

/* ---------- Confirmación ---------- */
let asiste = null, yo = null, buscaId = 0;
async function api(params, body){
  if(DEMO){
    await new Promise(r => setTimeout(r, 300));
    const P = { JAC0015:{nombre:'Ruth Aguilar Ramirez',sucursal:'Río'}, JAC0003:{nombre:'Diego Saldaña Rodriguez',sucursal:'Río'} };
    const g = normGafete((params || body).gafete), c = P[g];
    if(!c) throw new Error('No se encontró el número ' + g + '. Revisar el gafete o preguntar en RH.');
    return body ? { ...c, asiste: body.asiste } : c;
  }
  const r = body ? await fetch(API_URL, { method:'POST', body: JSON.stringify(body) }) : await fetch(API_URL + '?' + new URLSearchParams(params));
  const j = await r.json(); if(!j.ok) throw new Error(String(j.error || 'Error').replace(/^\w+\|/, '')); return j.data;
}
// Acepta "JAC0015", "jac 15", "0015" o "15"
function normGafete(g){
  const t = String(g || '').toUpperCase().replace(/[\s-]/g, ''), n = t.replace(/^JAC/, '');
  return /^\d{1,4}$/.test(n) ? 'JAC' + ('000' + n).slice(-4) : t;
}
let tBusca;
$('#gafete').addEventListener('input', () => {
  yo = null; clearTimeout(tBusca); $('#err').hidden = true;
  const g = normGafete($('#gafete').value), q = $('#quien');
  if(!/^JAC\d{4}$/.test(g)){ q.hidden = true; return; }
  q.hidden = false; q.className = 'quien busca'; q.textContent = 'Buscando…';
  tBusca = setTimeout(async () => {
    const id = ++buscaId;
    try{
      const c = await api({ action:'posadaGafete', gafete: g });
      if(id !== buscaId) return;
      yo = { ...c, gafete: g }; q.className = 'quien'; q.innerHTML = `👋 Hola, <b>${esc(c.nombre)}</b>${c.sucursal ? ' · ' + esc(c.sucursal) : ''}`;
    }catch(e){ if(id !== buscaId) return; q.className = 'quien mal'; q.textContent = e.message; }
  }, 450);
});
document.querySelectorAll('#opc button').forEach(b => b.onclick = () => {
  asiste = b.dataset.v; document.querySelectorAll('#opc button').forEach(x => x.classList.toggle('on', x === b));
});
$('#enviar').onclick = async () => {
  const err = t => { $('#err').textContent = t; $('#err').hidden = false; };
  $('#err').hidden = true;
  if(!yo) return err('Escribe tu número de empleado y espera a que aparezca tu nombre.');
  if(!asiste) return err('Indica si vas a ir o no.');
  const b = $('#enviar'); b.disabled = true; b.textContent = 'Enviando…';
  try{
    const r = await api(null, { action:'confirmarPosada', gafete: yo.gafete, asiste: asiste === 'SI', mensaje: $('#msg').value.trim() });
    lsSet('posada_resp', { nombre: r.nombre, gafete: yo.gafete, asiste: asiste === 'SI' });
    mostrarGracias(); if(asiste === 'SI') confeti();
  }catch(e){ err('No se pudo enviar: ' + e.message); }
  b.disabled = false; b.textContent = 'Confirmar';
};
function mostrarGracias(){
  const r = lsGet('posada_resp'); if(!r) return;
  const pila = r.nombre.split(' ')[0];
  $('#form').hidden = true; $('#gracias').hidden = false;
  $('#gracias').innerHTML = r.asiste
    ? `<div class="big">🎄</div><h2 class="script" style="color:#c3313b;font-size:30px">¡Te esperamos, ${esc(pila)}!</h2><p>Tu asistencia quedó confirmada.<br>Nos vemos el <b>16 de diciembre a las 8:00 p.m.</b></p>`
    : `<div class="big">💌</div><h2 class="script" style="color:#c3313b;font-size:30px">¡Gracias por avisar, ${esc(pila)}!</h2><p>Te vamos a extrañar. Si cambias de opinión, todavía puedes confirmar.</p>`;
  $('#gracias').innerHTML += `<button class="cambiar" id="cambiar">Cambiar mi respuesta</button>`;
  $('#cambiar').onclick = () => {
    $('#gracias').hidden = true; $('#form').hidden = false;
    $('#gafete').value = r.gafete || ''; $('#gafete').dispatchEvent(new Event('input')); asiste = null;
    document.querySelectorAll('#opc button').forEach(x => x.classList.remove('on'));
  };
}
mostrarGracias();
</script>
